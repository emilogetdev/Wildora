<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d">
<meta name="description" content="Banana Orange AI — dein KI-Chat in Wildora.">
<title>Banana Orange AI — Wildora</title>
<style>
:root{color-scheme:dark;--bg:#10131d;--panel:#191e2b;--panel2:#202738;--line:#30394c;--text:#f4f5f8;--muted:#a6afc0;--orange:#ff9c45;--yellow:#ffd36a;--purple:#9d8cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#3b2a2450,transparent 38%),radial-gradient(ellipse at 90% 10%,#3b327050,transparent 36%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,textarea{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;min-height:100vh;padding:26px 20px 24px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:5px 2px 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--yellow),var(--orange));display:grid;place-items:center;font-size:24px;box-shadow:0 8px 30px #ff9c4530}.brand h1{font-size:19px;letter-spacing:-.5px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:7px;color:#b9c5b9;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#70d69a;box-shadow:0 0 12px #70d69a70}
main{flex:1;display:flex;flex-direction:column;min-height:0}.welcome{margin:auto auto 22px;text-align:center;max-width:650px;padding:55px 10px 20px}.welcome .big{font-size:54px;line-height:1.2}.welcome h2{font-size:clamp(28px,5vw,42px);letter-spacing:-1.6px;margin:12px 0 8px}.welcome p{color:var(--muted);margin:0 auto;max-width:490px}.suggestions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px}.suggestions button{background:#ffffff08;border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:#dce2ed;font-size:13px}.suggestions button:hover{border-color:var(--orange);background:#ff9c4510}
#chat{display:flex;flex-direction:column;gap:18px;padding:28px 2px 22px;max-height:calc(100vh - 270px);overflow-y:auto;scroll-behavior:smooth}
.message{display:flex;gap:11px;max-width:86%;align-items:flex-start}.message.user{margin-left:auto;flex-direction:row-reverse}.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);font-size:16px}.message.assistant .avatar{background:linear-gradient(135deg,#ffd36a,#ff9c45);color:#241a12}.bubble{padding:12px 15px;border-radius:16px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#332b3c;border-color:#54436a}.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.typing{color:var(--muted);font-style:italic}
.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 0 0}.composer{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid #465066;border-radius:20px;padding:10px;box-shadow:0 16px 45px #0005}.composer:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px #ff9c4520,0 16px 45px #0005}textarea{resize:none;flex:1;min-height:28px;max-height:170px;border:0;outline:0;background:transparent;color:var(--text);padding:7px 8px;line-height:1.5}textarea::placeholder{color:#818da2}.send{width:42px;height:42px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--yellow),var(--orange));color:#2a1a0e;font-size:19px;font-weight:900}.send:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;color:#818da2;font-size:11px;margin:9px 0 0}.error{color:#ffb2a8}.new-chat{background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:#dce2ed;font-size:12px}.new-chat:hover{border-color:var(--orange)}
@media(max-width:600px){.app{padding:16px 13px}.welcome{padding-top:38px}.welcome .big{font-size:44px}#chat{max-height:calc(100vh - 240px)}.message{max-width:95%}.brand h1{font-size:17px}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🍌</div><div><h1>Banana Orange AI</h1><p>Powered by xAI · in Wildora</p></div></div><div style="display:flex;align-items:center;gap:12px"><div class="status"><span class="dot"></span> Bereit</div><button class="new-chat" id="newChat">Neuer Chat</button></div></header>
<main>
<section class="welcome" id="welcome"><div class="big">🍌🍊</div><h2>Was möchtest du wissen?</h2><p>Schreib Banana Orange AI eine Nachricht. Ich helfe dir beim Lernen, Ideenfinden, Erklären und vielem mehr.</p><div class="suggestions"><button>Erklär mir ein schwieriges Thema</button><button>Hilf mir bei einer Idee</button><button>Gib mir einen Lernplan</button></div></section>
<section id="chat" aria-live="polite" aria-label="Chatverlauf"></section>
<div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" maxlength="5000" placeholder="Nachricht an Banana Orange AI…" aria-label="Deine Nachricht"></textarea><button class="send" id="send" type="submit" aria-label="Senden">➤</button></form><p class="hint">Banana Orange AI kann Fehler machen. Teile keine Passwörter oder privaten Daten.</p></div>
</main>
</div>
<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";
const endpoint = SUPABASE_URL + "/functions/v1/banana-orange-ai";
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const input = document.getElementById("prompt");
const send = document.getElementById("send");
const history = [];
let busy = false;
function addMessage(role, content, extraClass="") {
  const row = document.createElement("div");
  row.className = "message " + role + " " + extraClass;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "🙂" : "🍊";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;
  row.append(avatar, bubble);
  chat.append(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}
function setBusy(value) {
  busy = value;
  send.disabled = value;
  input.disabled = value;
  send.textContent = value ? "…" : "➤";
}
async function submitMessage(text) {
  const message = text.trim();
  if (!message || busy) return;
  welcome.hidden = true;
  addMessage("user", message);
  history.push({role:"user",content:message});
  input.value = "";
  input.style.height = "auto";
  const pending = addMessage("assistant", "Banana Orange AI denkt nach …", "typing");
  setBusy(true);
  try {
    const response = await fetch(endpoint, {
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
      body:JSON.stringify({messages:history.slice(-12)})
    });
    const data = await response.json().catch(()=>({}));
    if (!response.ok) throw new Error(data.error || "Die KI ist gerade nicht erreichbar. Bitte versuche es später erneut.");
    const answer = String(data.reply || "").trim();
    if (!answer) throw new Error("Die KI hat eine leere Antwort zurückgegeben.");
    pending.textContent = answer;
    pending.parentElement.classList.remove("typing");
    history.push({role:"assistant",content:answer});
  } catch (error) {
    pending.textContent = "Fehler: " + error.message;
    pending.classList.add("error");
    pending.parentElement.classList.remove("typing");
    history.pop();
  } finally {
    setBusy(false);
    input.focus();
  }
}
document.getElementById("chatForm").addEventListener("submit", e=>{e.preventDefault();submitMessage(input.value)});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,170)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submitMessage(input.value)}});
document.querySelectorAll(".suggestions button").forEach(button=>button.addEventListener("click",()=>submitMessage(button.textContent)));
document.getElementById("newChat").addEventListener("click",()=>{history.length=0;chat.replaceChildren();welcome.hidden=false;input.value="";input.focus()});
</script>
</body>
</html>
